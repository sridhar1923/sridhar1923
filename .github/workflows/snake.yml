name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate the Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: sridhar1923
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F5821F&color_dots=#15131D,#705898,#2EC4B6,#F5821F,#E8452C
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=#E8452C&color_dots=#FFF4E0,#705898,#2EC4B6,#F5821F,#E8452C

      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
