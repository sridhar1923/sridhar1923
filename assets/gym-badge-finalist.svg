<svg xmlns="http://www.w3.org/2000/svg" width="320" height="90" viewBox="0 0 320 90" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="50%" stop-color="#15131D"/>
      <stop offset="100%" stop-color="#1E1B2E"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5821F"/>
      <stop offset="50%" stop-color="#2EC4B6"/>
      <stop offset="100%" stop-color="#E8452C"/>
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5821F"/>
      <stop offset="100%" stop-color="#E8452C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="316" height="86" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Left Gym Emblem (InnoHacks Badge Medal) -->
  <g transform="translate(16, 13)">
    <!-- Outer Octagon Badge -->
    <polygon points="32,2 54,12 62,32 54,52 32,62 10,52 2,32 10,12" fill="#1B1E36" stroke="url(#badgeGold)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Inner Octagon -->
    <polygon points="32,8 48,16 54,32 48,48 32,56 16,48 10,32 16,16" fill="url(#badgeGold)" opacity="0.25"/>
    <!-- Trophy / Star Icon -->
    <path d="M24 20 H40 V28 C40 34 36 38 32 38 C28 38 24 34 24 28 Z M24 23 H20 C18.5 23 18 25 18 27 C18 31 20 33 24 33 Z M40 23 H44 C45.5 23 46 25 46 27 C46 31 44 33 40 33 Z M30 38 H34 V44 H30 Z M26 44 H38 V46 H26 Z" fill="#FFE066"/>
  </g>

  <!-- Text Details -->
  <text x="90" y="28" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="11" fill="#2EC4B6" letter-spacing="1.5">GYM BADGE • INNOHACKS 4.0</text>
  <text x="90" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="800" font-size="16" fill="#FFF4E0" letter-spacing="0.5">Hackathon Finalist</text>
  <text x="90" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="12" fill="#F5821F">Submitted Project: <tspan fill="#FFF4E0" font-weight="600">ReRun (Agentic AI)</tspan></text>
</svg>
