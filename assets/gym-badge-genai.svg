  <text x="76" y="67" font-family="'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="11.5" fill="#8B949E">Event: <tspan fill="#C9D1D9">InnoHacks 4.0 Hackathon</tspan></text>
