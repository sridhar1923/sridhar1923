<svg xmlns="http://www.w3.org/2000/svg" width="320" height="90" viewBox="0 0 320 90" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D15"/>
      <stop offset="50%" stop-color="#15131D"/>
      <stop offset="100%" stop-color="#2D1117"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8452C"/>
      <stop offset="50%" stop-color="#F5821F"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8452C"/>
      <stop offset="50%" stop-color="#F5821F"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="316" height="86" rx="12" fill="url(#bgGrad2)" stroke="url(#borderGrad2)" stroke-width="2"/>

  <!-- Left Gym Emblem (Charizard Flame Badge) -->
  <g transform="translate(18, 13)">
    <!-- Outer Diamond / Flame Base -->
    <polygon points="30,2 54,20 48,56 30,62 12,56 6,20" fill="#2E1218" stroke="url(#borderGrad2)" stroke-width="2.5" filter="url(#flameGlow)"/>
    <!-- Inner Flame Motif -->
    <path d="M30 10 C34 18, 42 24, 40 36 C38 46, 26 52, 30 54 C24 50, 18 42, 22 34 C24 30, 24 24, 30 10 Z" fill="url(#flameGrad)" />
    <!-- Core Spark -->
    <circle cx="30" cy="38" r="4" fill="#FFF4E0" opacity="0.85"/>
  </g>

  <!-- Text Details -->
  <text x="90" y="28" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="11" fill="#FFE066" letter-spacing="1.5">GYM BADGE • CHAMPION TRACK</text>
  <text x="90" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="800" font-size="16" fill="#FFF4E0" letter-spacing="0.5">Best GenAI Track Winner</text>
  <text x="90" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="12" fill="#F5821F">Event: <tspan fill="#FFF4E0" font-weight="600">InnoHacks 4.0 Hackathon</tspan></text>
</svg>
