  <!-- Legend & Action Prompt -->
  <text x="380" y="45" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#F5821F">PLATANE CONTRIBUTION SNAKE</text>
  <text x="380" y="66" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="11.5" fill="#FFF4E0">Automated GitHub Action configured in <tspan fill="#2EC4B6" font-family="'JetBrains Mono', monospace">.github/workflows/snake.yml</tspan></text>
  <text x="380" y="86" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="11" fill="#C5BAAF">Outputs dynamically to branch: <tspan fill="#F5821F" font-weight="600">output</tspan> every 12 hours.</text>

  <!-- Palette Dots Legend -->
  <g transform="translate(380, 102)">
    <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="10" fill="#705898">Less</text>
    <rect x="30" y="0" width="10" height="10" rx="2" fill="#1E2333"/>
    <rect x="44" y="0" width="10" height="10" rx="2" fill="#705898"/>
    <rect x="58" y="0" width="10" height="10" rx="2" fill="#2EC4B6"/>
    <rect x="72" y="0" width="10" height="10" rx="2" fill="#F5821F"/>
    <rect x="86" y="0" width="10" height="10" rx="2" fill="#E8452C"/>
