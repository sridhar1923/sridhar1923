    <rect x="28" y="0" width="10" height="10" rx="2" fill="#1E2333"/>
    <rect x="28" y="14" width="10" height="10" rx="2" fill="#2EC4B6"/>
    <rect x="28" y="28" width="10" height="10" rx="2" fill="#E8452C"/>
